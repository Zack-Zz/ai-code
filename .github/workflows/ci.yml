name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tools, packages and lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate every registered plugin source
        run: python3 tooling/plugin_tool.py validate --all

      - name: Validate workflow-specific contracts
        run: python3 plugins/ai-code-workflow/scripts/workflow_tool.py validate --root plugins/ai-code-workflow

      - name: Unified test gate (tooling and every registered plugin)
        run: npm test

      - name: Build every plugin for its supported hosts
        run: python3 tooling/plugin_tool.py build --all --host all --output dist-ci

      - name: Check every built package against its registered source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          tool = [sys.executable, "tooling/plugin_tool.py"]
          source = json.loads(subprocess.check_output(tool + ["list"], text=True))["plugins"]
          index = json.loads(Path("dist-ci/index.json").read_text())
          if index["schema_version"] != 2 or set(index["plugins"]) != {item["product_id"] for item in source}:
              raise SystemExit("build index differs from registered plugin inventory")
          for plugin in source:
              identity = plugin["product_id"]
              if set(index["plugins"][identity]["hosts"]) != set(plugin["hosts"]):
                  raise SystemExit(f"build index differs from supported hosts: {identity}")
              for host in plugin["hosts"]:
                  subprocess.run(tool + ["package", "check", "--plugin", identity,
                      "--path", f"dist-ci/{host}/{identity}", "--host", host], check=True)
          PY

      - name: Verify committed dist/ matches a fresh reproducible build
        run: python3 .github/scripts/check_dist.py --committed dist --fresh dist-ci

      - name: Lint
        run: |
          npm install --no-audit --no-fund
          npm run lint
