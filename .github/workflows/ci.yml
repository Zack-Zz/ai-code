name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tools, packages and lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate every registered plugin source
        run: python3 tooling/plugin_tool.py validate --all

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject tracked temporary distributions
        run: python3 .github/scripts/check_no_dist.py --root .

      - name: Validate workflow-specific contracts
        run: python3 plugins/ai-code-workflow/scripts/workflow_tool.py validate --root plugins/ai-code-workflow

      - name: Unified test gate (tooling and every registered plugin)
        run: npm test

      - name: Build every plugin for its supported hosts
        run: python3 tooling/plugin_tool.py build --all --host all --output "$RUNNER_TEMP/packages"

      - name: Check every built package against its registered source
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          tool = [sys.executable, "tooling/plugin_tool.py"]
          source = json.loads(subprocess.check_output(tool + ["list"], text=True))["plugins"]
          output = Path(os.environ["RUNNER_TEMP"]) / "packages"
          index = json.loads((output / "index.json").read_text())
          if index["schema_version"] != 2 or set(index["plugins"]) != {item["product_id"] for item in source}:
              raise SystemExit("build index differs from registered plugin inventory")
          for plugin in source:
              identity = plugin["product_id"]
              if set(index["plugins"][identity]["hosts"]) != set(plugin["hosts"]):
                  raise SystemExit(f"build index differs from supported hosts: {identity}")
              for host in plugin["hosts"]:
                  subprocess.run(tool + ["package", "check", "--plugin", identity,
                      "--path", str(output / host / identity), "--host", host], check=True)
          PY

      - name: Verify native repository marketplace entry points
        run: python3 tooling/plugin_tool.py marketplace check --root .

      - name: Lint
        run: npm run lint
