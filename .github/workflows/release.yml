name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Registered plugin ID
        required: true
        default: ai-code-workflow
        type: string
      source_tag:
        description: Existing frozen ID/vVERSION tag reachable from main
        required: true
        type: string
      operation:
        description: Prepare a bundle or publish after environment review
        required: true
        default: prepare
        type: choice
        options: [prepare, publish]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: plugin-release-${{ github.repository }}-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
      kind: ${{ steps.prepare.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify canonical tag and main ancestry before executing source tests
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          python3 trusted/.github/scripts/prepare_release.py --root source --plugin "$PLUGIN_ID" --source-tag "$SOURCE_TAG" --check-source-only
      - name: Test and lint frozen source with read permissions
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: Validate frozen source with trusted tools
        run: |
          python3 trusted/.github/scripts/check_no_dist.py --root source
          python3 trusted/tooling/plugin_tool.py validate --root source --all
      - name: Prepare and independently verify frozen source
        id: prepare
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          python3 trusted/.github/scripts/prepare_release.py --root source --plugin "$PLUGIN_ID" --source-tag "$SOURCE_TAG" --output "$RUNNER_TEMP/release-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.operation == 'publish' && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 15
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-bundle/
      - name: Create verified Draft and upload every asset
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ID: ${{ inputs.plugin }}
        run: |
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          python3 trusted/.github/scripts/create_release_draft.py --root source --plugin "$PLUGIN_ID" --bundle "$RUNNER_TEMP/release-bundle" --repository "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/draft-result.json"
      - name: Read back uploaded bytes and explicitly publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 trusted/.github/scripts/publish_release.py --root source --plugin "$PLUGIN_ID" --source-tag "$SOURCE_TAG" --bundle "$RUNNER_TEMP/release-bundle" --repository "$GITHUB_REPOSITORY" --draft-result "$RUNNER_TEMP/draft-result.json" > "$RUNNER_TEMP/publish-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: plugin-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/*-result.json
          if-no-files-found: warn
          retention-days: 30

  sync-marketplace:
    if: ${{ needs.publish.result == 'success' && needs.prepare.outputs.kind == 'stable' && github.ref == 'refs/heads/main' }}
    needs: [prepare, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/marketplace.yml
    with:
      plugin: ${{ inputs.plugin }}
      source_tag: ${{ inputs.source_tag }}
      action: deploy
