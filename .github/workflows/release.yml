name: Build & publish plugins / 构建与发布插件

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin / 插件
        required: true
        default: ai-code-workflow
        type: choice
        options: [ai-code-workflow, ai-agent-delegation, ai-code-stack-standards]
      operation:
        description: Build only / 仅构建；Publish + stable market / 发布并更新正式市场
        required: true
        default: build
        type: choice
        options: [build, publish]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: plugin-release-${{ github.repository }}-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
      kind: ${{ steps.prepare.outputs.kind }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Freeze committed main version before executing source tests
        id: freeze
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          python3 trusted/.github/scripts/prepare_release.py --root source --plugin "$PLUGIN_ID" --from-main --revision "$DISPATCH_SHA" --check-source-only
      - name: Test and lint frozen source with read permissions
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
      - name: Validate frozen source with trusted tools
        run: |
          python3 trusted/.github/scripts/check_no_dist.py --root source
          python3 trusted/tooling/plugin_tool.py validate --root source --all
      - name: Prepare and independently verify frozen source
        id: prepare
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_TAG: ${{ steps.freeze.outputs.tag }}
        run: |
          python3 trusted/.github/scripts/prepare_release.py --root source --plugin "$PLUGIN_ID" --source-tag "$SOURCE_TAG" --output "$RUNNER_TEMP/release-bundle"
      - name: Show downloads and independent host verification status
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-bundle/release.json').read_text())
          status = record['readiness']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## {record['product_id']} {record['version']}\n\n")
              summary.write('Download the artifact below; native installers are in `installers/`, development packages in `downloads/`. / 下载下方 artifact，原生安装包位于 `installers/`，开发包位于 `downloads/`。\n\n')
              summary.write(f"Frozen source: `{record['source_revision']}`; tag: `{record['tag']}`\n\n")
              summary.write('Host verification / 宿主实测（independent of publication）:\n\n')
              summary.write('- verified: ' + (', '.join(status['accepted_hosts']) or 'none') + '\n')
              summary.write('- unverified: ' + (', '.join(status['pending_acceptance']) or 'none') + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.operation == 'publish' && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 15
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-bundle/
      - name: Rebind the frozen source in the isolated CI checkout
        env:
          PLUGIN_ID: ${{ inputs.plugin }}
          DISPATCH_SHA: ${{ needs.prepare.outputs.revision }}
        run: |
          git -C source fetch --no-tags origin main:refs/remotes/origin/main
          python3 trusted/.github/scripts/prepare_release.py --root source --plugin "$PLUGIN_ID" --from-main --revision "$DISPATCH_SHA" --check-source-only
      - name: Verify uploaded bytes and publish or reuse the immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ID: ${{ inputs.plugin }}
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 trusted/.github/scripts/publish_release.py --root source --plugin "$PLUGIN_ID" --source-tag "$SOURCE_TAG" --bundle "$RUNNER_TEMP/release-bundle" --repository "$GITHUB_REPOSITORY" --ensure-tag > "$RUNNER_TEMP/publish-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: plugin-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/*-result.json
          if-no-files-found: warn
          retention-days: 30

  sync-marketplace:
    if: ${{ needs.publish.result == 'success' && needs.prepare.outputs.kind == 'stable' && github.ref == 'refs/heads/main' }}
    needs: [prepare, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/marketplace.yml
    with:
      plugin: ${{ inputs.plugin }}
      source_tag: ${{ needs.prepare.outputs.tag }}
